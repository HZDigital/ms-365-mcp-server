name: Trigger auto deployment for ms-365-mcp-4c

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ms-365-mcp-4c-AutoDeployTrigger-903bf521-0402-4896-8b68-be344109af1c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MS365MCP4C_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MS365MCP4C_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MS365MCP4C_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 4cgroupagcontainerregistry.azurecr.io
          registryUsername: ${{ secrets.MS365MCP4C_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MS365MCP4C_REGISTRY_PASSWORD }}
          containerAppName: ms-365-mcp-4c
          resourceGroup: rg-mindscape
          imageToBuild: 4cgroupagcontainerregistry.azurecr.io/ms-365-mcp-4c:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


