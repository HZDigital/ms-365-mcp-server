name: Beka MCP

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/beka-ms-365-mcp-AutoDeployTrigger-54bbcd00-0960-423d-adfb-45944fb0114c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BEKAMS365MCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BEKAMS365MCP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BEKAMS365MCP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: lizzycra.azurecr.io
          registryUsername: ${{ secrets.BEKAMS365MCP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BEKAMS365MCP_REGISTRY_PASSWORD }}
          containerAppName: beka-ms-365-mcp
          resourceGroup: RG_lizzy
          imageToBuild: lizzycra.azurecr.io/beka-ms-365-mcp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


